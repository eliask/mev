name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up CPython 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check maintained PAA code and tests with Ruff
        run: uv run --locked ruff check paa tests mev/llm.py

      - name: Check maintained semantic boundary with ty
        run: uv run --locked ty check

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Build and check the frozen source-to-browser path
        shell: bash
        run: |
          run_root="$(mktemp -d "${RUNNER_TEMP}/paa-frozen.XXXXXX")"
          uv run --locked paa frozen --root "$run_root"
          uv run --locked paa check --db "$run_root/data/paa.sqlite" --slice

      - name: Check public packages and replay the installed wheel
        shell: bash
        run: |
          package_root="$(mktemp -d "${RUNNER_TEMP}/paa-packages.XXXXXX")"
          uv build --out-dir "$package_root"
          uv export --locked --no-dev --no-emit-project --output-file "$package_root/requirements.txt"
          uv venv --python 3.14 "$package_root/venv"
          uv pip install --python "$package_root/venv/bin/python" -r "$package_root/requirements.txt" "$package_root"/*.whl
          python scripts/paa_package_check.py \
            --sdist "$package_root"/*.tar.gz --wheel "$package_root"/*.whl \
            --python "$package_root/venv/bin/python" --work-dir "$package_root/replay"
